# Runs the libraries' tests on Linux, macOS, and Windows for pull requests and for pushes to main, so
# that the Foundation-only libraries keep building everywhere Swift runs. The macOS app is built and
# released separately with make-app.sh; the macOS job type-checks that build.
#
# To keep the wait short (Adam, 2026-11-02): a branch with a pull request runs once, not once for the
# push and once for the pull request; a newer push cancels a run still going for the same branch; and
# changes only to Markdown, docs/, or Design/ don't run the tests, since nothing they touch is built.

name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "Design/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "Design/**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: PERFORMANCE_BRIDGE_TESTS=1 swift test
      # make-app.sh compiles every library folder and the app as one module, which SwiftPM never
      # checks: a top-level name shared by two folders, or a symbol one folder uses from another
      # without `public`, fails only there. This type-checks that build without Sparkle (the app
      # guards it with `#if canImport(Sparkle)`) and without producing an app bundle.
      - name: Type-check the app as one module
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-macos13.0 \
            -module-name PerformanceBridge \
            Sources/OSCCodec/*.swift Sources/TotalMixOSC/*.swift Sources/RotoControl/*.swift \
            Sources/MIDITransport/*.swift Sources/UDPTransport/*.swift Sources/SurfaceCore/*.swift \
            Sources/RotoDriver/*.swift Sources/LaunchControl/*.swift Sources/LaunchControlDriver/*.swift \
            Sources/OXIE16/*.swift Sources/E16Driver/*.swift \
            Sources/BridgeEngine/*.swift App/PerformanceBridge/*.swift

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      # As in 3rd-wave-tools: Swift 6.0.3 cannot build a package manifest against the runner's
      # current Windows SDK; 6.2 can.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - name: Test
        env:
          PERFORMANCE_BRIDGE_TESTS: "1"
        run: swift test
